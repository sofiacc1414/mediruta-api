# Blueprint de despliegue en Render — ver DOCS/context.md.
# Al conectar este repo en Render (New > Blueprint), este archivo configura
# el servicio automáticamente. Los valores marcados `sync: false` son
# secretos: Render los pide en su dashboard, nunca se escriben aquí.

services:
  - type: web
    name: mediruta-api
    runtime: node
    region: ohio # más cercano a Supabase (aws-0-us-east-2)
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
